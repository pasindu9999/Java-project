# Local infrastructure: Kafka (KRaft, single node), one Postgres per service, kafka-ui.
#   docker compose up -d        start
#   docker compose down -v      stop and wipe data
# Credentials below are local-only defaults; never reuse them anywhere else.
name: orderflow

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is for containers on the compose network, EXTERNAL for apps running on the host.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared in code by their owning service (ARCHITECTURE §4).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  order-db:
    image: postgres:18.6-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    volumes:
      - order-db-data:/var/lib/postgresql
    healthcheck: &pg-health
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-db:
    image: postgres:18.6-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    volumes:
      - inventory-db-data:/var/lib/postgresql
    healthcheck: *pg-health

  payment-db:
    image: postgres:18.6-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    volumes:
      - payment-db-data:/var/lib/postgresql
    healthcheck: *pg-health

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------------------------------------
  # The three services, only with:  docker compose --profile apps up -d --build
  # Without the profile, compose starts the infrastructure only and the services run from the IDE or Maven.
  # They use the `local` profile (seed stock, the demo's blocked customer) and the INTERNAL Kafka listener.
  # ---------------------------------------------------------------------------------------------------------
  order-service:
    profiles: [apps]
    build:
      context: .
      args:
        SERVICE: order-service
    image: orderflow/order-service:local
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
      order-db:
        condition: service_healthy
    healthcheck: &app-health
      test: ["CMD", "healthcheck", "8081"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  inventory-service:
    profiles: [apps]
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: orderflow/inventory-service:local
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD", "healthcheck", "8082"]

  payment-service:
    profiles: [apps]
    build:
      context: .
      args:
        SERVICE: payment-service
    image: orderflow/payment-service:local
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
      payment-db:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD", "healthcheck", "8083"]

volumes:
  order-db-data:
  inventory-db-data:
  payment-db-data:
