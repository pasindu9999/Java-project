server:
  port: 8082

spring:
  application:
    name: inventory-service
  # Defaults point at docker-compose.yml. Override with SPRING_DATASOURCE_* / SPRING_KAFKA_* env vars.
  datasource:
    url: jdbc:postgresql://localhost:5434/inventory_db
    username: orderflow
    password: orderflow
  flyway:
    locations: classpath:db/migration/inventory
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: inventory-service
      # A new consumer group starts from the oldest message, so nothing sent before it first joined is lost.
      auto-offset-reset: earliest
      # Offsets are committed by the listener container, only after the record's DB transaction commits.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit after every record, so a crash re-delivers at most the record being processed (ADR-0003).
      ack-mode: record
      # One consumer thread per partition.
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
