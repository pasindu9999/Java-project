server:
  port: 8081

spring:
  application:
    name: order-service
  # Defaults point at docker-compose.yml. Override with SPRING_DATASOURCE_* / SPRING_KAFKA_* env vars.
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: orderflow
    password: orderflow
  flyway:
    locations: classpath:db/migration/order
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Wait for all in-sync replicas, and let the broker drop the producer's own retry duplicates.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service

orderflow:
  saga:
    timeout: PT30S

management:
  endpoints:
    web:
      exposure:
        include: health,info
