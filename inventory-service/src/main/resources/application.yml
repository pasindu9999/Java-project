server:
  port: 8082

spring:
  application:
    name: inventory-service
  # Defaults point at docker-compose.yml. Override with SPRING_DATASOURCE_* / SPRING_KAFKA_* env vars.
  datasource:
    url: jdbc:postgresql://localhost:5434/inventory_db
    username: orderflow
    password: orderflow
  flyway:
    locations: classpath:db/migration/inventory
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
