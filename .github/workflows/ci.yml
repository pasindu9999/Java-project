name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The wrapper is committed from Windows, where the executable bit may not be recorded.
      - run: chmod +x mvnw

      # Unit tests (surefire) + integration tests against real Postgres/Kafka (failsafe + Testcontainers).
      - run: ./mvnw -B -ntp verify
