server:
  port: 8081

spring:
  application:
    name: order-service
  # Defaults point at docker-compose.yml. Override with SPRING_DATASOURCE_* / SPRING_KAFKA_* env vars.
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: orderflow
    password: orderflow
  flyway:
    locations: classpath:db/migration/order
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Wait for all in-sync replicas, and let the broker drop the producer's own retry duplicates.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      # A new consumer group starts from the oldest message, so nothing sent before it first joined is lost.
      auto-offset-reset: earliest
      # Offsets are committed by the listener container, only after the record's DB transaction commits.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit after every record, so a crash re-delivers at most the record being processed (ADR-0003).
      ack-mode: record
      # One consumer thread per partition.
      concurrency: 3

orderflow:
  saga:
    timeout: PT30S
    # OrderTimeoutSweeper: how often it looks for expired orders, and how many it cancels per run.
    sweep-interval: PT5S
    sweep-batch-size: 50

logging:
  pattern:
    # orderId (correlationId) and messageId of the message being handled, from the MDC set by
    # IdempotentMessageHandler. Outside message handling the MDC is empty and the replace drops the bare "[ ] ".
    # grep a log for an orderId to follow one saga.
    correlation: "%replace([%X{correlationId:-} %X{messageId:-}] ){'^. . $', ''}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
